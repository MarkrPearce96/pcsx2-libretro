name: libretro_release

# Builds the pcsx2-libretro core on tag push and publishes a GitHub Release
# with the macOS x86_64 dylib + resources packaged as a single zip.
#
# Spec: see RetroNest-Project/docs/superpowers/specs/2026-05-21-pcsx2-libretro-github-publishing-design.md
# Process: see UPSTREAM-UPDATE.md at the repo root.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required for softprops/action-gh-release to create releases

jobs:
  build:
    name: Build macOS x86_64
    # macos-14 = Apple Silicon (arm64) with Rosetta. We use x86_64 Homebrew at
    # /usr/local + arch -x86_64 wrappers so the final dylib is x86_64. Chosen
    # over macos-13 because the Intel runner pool is starved (30-90 min queue
    # waits); Apple Silicon runners dequeue in seconds.
    runs-on: macos-14
    timeout-minutes: 120  # +30 min vs macos-13 due to Rosetta translation cost
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rosetta
        run: |
          # Rosetta 2 is required to execute the x86_64 toolchain on arm64.
          softwareupdate --install-rosetta --agree-to-license || true

      - name: Install x86_64 Homebrew at /usr/local
        run: |
          if [ ! -x /usr/local/bin/brew ]; then
            echo "Installing x86_64 Homebrew at /usr/local..."
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew --version

      - name: Install Homebrew dependencies (x86_64)
        run: |
          arch -x86_64 /usr/local/bin/brew update
          arch -x86_64 /usr/local/bin/brew install \
            cmake \
            ninja \
            libpng \
            libjpeg \
            libzip \
            zstd \
            qt@6 \
            sdl3 \
            shaderc \
            rapidyaml \
            plutosvg \
            plutovg \
            molten-vk \
            lz4 \
            dylibbundler

      - name: Configure (cmake under arch -x86_64)
        run: |
          # CRITICAL: scrub /opt/homebrew (arm64 brew) from CMake's search
          # paths so it doesn't pick up arm64 libraries. Without this, the
          # configure step succeeds but the linker fails with "symbol(s) not
          # found for architecture x86_64" because libpng/libzip/etc were
          # found at /opt/homebrew/lib (arm64).
          arch -x86_64 env \
            HOMEBREW_PREFIX=/usr/local \
            HOMEBREW_CELLAR=/usr/local/Cellar \
            HOMEBREW_REPOSITORY=/usr/local/Homebrew \
            PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig \
            PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            /usr/local/bin/cmake -S . -B build \
              -G Ninja \
              -DCMAKE_PREFIX_PATH="/usr/local;/usr/local/opt/qt@6" \
              -DCMAKE_IGNORE_PATH=/opt/homebrew \
              -DENABLE_LIBRETRO=ON \
              -DENABLE_QT_UI=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build pcsx2_libretro target
        run: |
          arch -x86_64 env \
            PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            /usr/local/bin/cmake --build build --target pcsx2_libretro -j

      - name: Bundle non-system dependencies (self-contained release)
        run: |
          # The core links ~10 Homebrew dylibs by their EXACT versioned name
          # (e.g. libryml.0.15.2.dylib). A user whose Homebrew has a different
          # version can't dlopen it — the core dies silently at load (observed
          # 2026-07-04: rapidyaml 0.15.2 on the runner vs 0.12.1 on the user).
          # Bundle + flatten + sign + verify all live in the vendored contract
          # package (deploy-contract.md §Dependency bundling) — shared with
          # dolphin's workflow, drift-checked like every package file.
          pcsx2-libretro/retronest-libretro/package-core.sh \
            build/pcsx2-libretro/pcsx2_libretro.dylib --arch x86_64

      - name: Compile Metal shader libraries into bin/resources/
        run: |
          # The metallib custom-commands in pcsx2/CMakeLists.txt live inside
          # setup_main_executable(), which is only called for the standalone
          # pcsx2-qt target. Our libretro build (-DENABLE_QT_UI=OFF) never
          # invokes that function, so the metallibs are never compiled. PCSX2
          # at runtime needs default/Metal22/Metal23 .metallib files for GS
          # device init or it fails with "Failed to create render device".
          # We replicate the cmake recipe inline here so the upload step picks
          # them up. xcrun metal/metallib are arch-independent (output is AIR
          # bytecode + linked metallib), no need for arch -x86_64.
          set -euo pipefail
          SHADERS=(
            pcsx2/GS/Renderers/Metal/cas.metal
            pcsx2/GS/Renderers/Metal/convert.metal
            pcsx2/GS/Renderers/Metal/present.metal
            pcsx2/GS/Renderers/Metal/merge.metal
            pcsx2/GS/Renderers/Metal/misc.metal
            pcsx2/GS/Renderers/Metal/interlace.metal
            pcsx2/GS/Renderers/Metal/tfx.metal
            pcsx2/GS/Renderers/Metal/fxaa.metal
          )
          compile_metallib() {
            local std="$1" triple="$2" outname="$3"
            local airdir="build/metal-${outname}"
            mkdir -p "$airdir"
            local airfiles=()
            for shader in "${SHADERS[@]}"; do
              local base
              base="$(basename "$shader" .metal)"
              local out="$airdir/$base.air"
              xcrun metal -ffast-math -std="$std" -target "$triple" -o "$out" -c "$shader"
              airfiles+=("$out")
            done
            xcrun metallib -o "bin/resources/${outname}.metallib" "${airfiles[@]}"
          }
          compile_metallib macos-metal2.0 air64-apple-macos10.13 default
          compile_metallib macos-metal2.2 air64-apple-macos10.15 Metal22
          compile_metallib macos-metal2.3 air64-apple-macos11.0  Metal23
          ls -la bin/resources/*.metallib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx2_libretro-dylib
          path: build/pcsx2-libretro/pcsx2_libretro.dylib
          if-no-files-found: error

      - name: Upload bundled libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx2_libretro-libs
          path: build/pcsx2-libretro/pcsx2_libretro_libs/
          if-no-files-found: error

      - name: Upload resources artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcsx2_libretro-resources
          path: bin/resources/
          if-no-files-found: error

  release:
    name: Package and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for SHA lookup)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dylib artifact
        uses: actions/download-artifact@v4
        with:
          name: pcsx2_libretro-dylib
          path: stage/

      - name: Download resources artifact
        uses: actions/download-artifact@v4
        with:
          name: pcsx2_libretro-resources
          path: stage/pcsx2_libretro_resources/

      - name: Download bundled libs artifact
        uses: actions/download-artifact@v4
        with:
          name: pcsx2_libretro-libs
          path: stage/pcsx2_libretro_libs/

      - name: Fetch upstream master (for SHA lookup)
        run: |
          git remote add upstream https://github.com/PCSX2/pcsx2.git
          # Full fetch so merge-base finds the real rebase point regardless of
          # how far upstream has advanced since our last rebase.
          git fetch upstream master

      - name: Compute version metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          FORK_SHA="$(git rev-parse HEAD)"
          # upstream_sha: the merge-base of HEAD and upstream/master is the
          # upstream tip we last rebased onto (after a clean rebase, all of
          # upstream/master is reachable from HEAD, so merge-base returns
          # upstream/master's tip).
          UPSTREAM_SHA="$(git merge-base HEAD upstream/master)"
          UPSTREAM_SHORT="$(echo "$UPSTREAM_SHA" | cut -c1-7)"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "tag=$TAG"
            echo "platform=macos-x86_64"
            echo "fork_sha=$FORK_SHA"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "upstream_ref=upstream/master"
            echo "build_date=$BUILD_DATE"
          } > stage/VERSION
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$UPSTREAM_SHORT" >> "$GITHUB_OUTPUT"

      - name: Verify staged contents
        run: |
          ls -la stage/
          test -f stage/pcsx2_libretro.dylib
          test -d stage/pcsx2_libretro_resources
          test -f stage/VERSION
          cat stage/VERSION

      - name: Create zip
        run: |
          cd stage
          zip -r ../pcsx2_libretro.dylib.zip \
            pcsx2_libretro.dylib \
            pcsx2_libretro_resources \
            pcsx2_libretro_libs \
            VERSION
          cd ..
          ls -la pcsx2_libretro.dylib.zip

      - name: Compose release body
        run: |
          {
            echo "**Platform:** macOS x86_64 (Intel + Apple Silicon via Rosetta)"
            echo "**Upstream PCSX2:** ${{ steps.meta.outputs.upstream_short }} (master)"
            echo ""
            echo "## Changes since previous release"
          } > release_body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release_body.md
          generate_release_notes: true   # appends auto-generated commit list below body
          files: pcsx2_libretro.dylib.zip
          fail_on_unmatched_files: true
